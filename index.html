<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<meta name="theme-color"
      content="#09090d">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="apple-mobile-web-app-title"
      content="说爱你">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="format-detection"
      content="telephone=no">

<meta name="description"
      content="说爱你 · 交响乐版">

<title>说爱你 · 交响乐版</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    min-height: 100%;

    background: #09090d;

    overscroll-behavior: none;
}

body {

    width: 100%;

    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;

    background:
        radial-gradient(
            circle at 50% 8%,
            rgba(255, 120, 170, 0.16),
            transparent 30%
        ),

        radial-gradient(
            circle at 10% 90%,
            rgba(130, 90, 180, 0.08),
            transparent 28%
        ),

        linear-gradient(
            160deg,
            #08080c 0%,
            #111118 48%,
            #08080c 100%
        );

    color: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "PingFang SC",
        "Helvetica Neue",
        Arial,
        sans-serif;

    overflow-x: hidden;

    overscroll-behavior-y: none;

    -webkit-font-smoothing: antialiased;
}


/* =====================================================
   PAGE
===================================================== */

.page {

    width: 100%;

    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;

    display: flex;

    justify-content: center;

    padding-top:
        max(18px, env(safe-area-inset-top));

    padding-right:
        max(18px, env(safe-area-inset-right));

    padding-bottom:
        max(18px, env(safe-area-inset-bottom));

    padding-left:
        max(18px, env(safe-area-inset-left));
}


.container {

    width: 100%;

    max-width: 430px;

    min-height:
        calc(100svh - 36px);

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    padding-top: 4px;

    padding-bottom: 15px;

    animation:
        pageIn 0.7s ease both;
}


/* =====================================================
   NFC BADGE
===================================================== */

.nfc-badge {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding: 8px 15px;

    border:
        1px solid rgba(255,255,255,0.11);

    border-radius: 999px;

    background:
        rgba(255,255,255,0.045);

    color:
        rgba(255,255,255,0.60);

    font-size: 11px;

    letter-spacing: 1.4px;

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    margin-bottom: 18px;

    flex-shrink: 0;
}


.nfc-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ff8eb5;

    box-shadow:
        0 0 12px
        rgba(255,142,181,0.85);

    animation:
        nfcPulse 2s ease-in-out infinite;
}


/* =====================================================
   RECORD
===================================================== */

.record-wrapper {

    position: relative;

    width:
        min(64vw, 270px);

    height:
        min(64vw, 270px);

    flex-shrink: 0;

    margin-bottom: 22px;
}


.record-glow {

    position: absolute;

    inset: 13%;

    border-radius: 50%;

    background:
        rgba(255, 105, 155, 0.18);

    filter: blur(30px);

    opacity: 0.6;

    transition:
        opacity 0.5s ease;
}


.record {

    position: relative;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    background:

        repeating-radial-gradient(
            circle,
            #19191f 0px,
            #19191f 2px,
            #0e0e12 3px,
            #0e0e12 6px
        );

    box-shadow:

        0 22px 55px
        rgba(0,0,0,0.62),

        inset 0 0 0 1px
        rgba(255,255,255,0.04);

    animation:
        recordRotate 13s linear infinite;

    animation-play-state: paused;

    overflow: hidden;
}


.record.playing {

    animation-play-state: running;
}


.record::before {

    content: "";

    position: absolute;

    inset: 7%;

    border-radius: 50%;

    background:
        linear-gradient(
            130deg,
            rgba(255,255,255,0.045),
            transparent 38%,
            rgba(255,255,255,0.015)
        );

    pointer-events: none;
}


.record-center {

    position: absolute;

    width: 34%;

    aspect-ratio: 1;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #ff9fbd,
            #c54f78
        );

    box-shadow:

        0 0 0 4px
        rgba(255,255,255,0.035),

        0 0 30px
        rgba(255,120,160,0.28);
}


.record-center img {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
}


.record-hole {

    position: absolute;

    width: 8px;
    height: 8px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #08080c;

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,0.10);
}


/* =====================================================
   SONG INFO
===================================================== */

.song-title {

    font-size:
        clamp(28px, 8vw, 34px);

    line-height: 1.2;

    font-weight: 700;

    letter-spacing: 2px;

    margin-bottom: 6px;

    flex-shrink: 0;
}


.song-subtitle {

    font-size: 14px;

    line-height: 1.3;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,0.48);

    margin-bottom: 18px;

    flex-shrink: 0;
}


/* =====================================================
   PLAYER
===================================================== */

.player {

    width: 100%;

    padding:
        15px 17px 14px;

    border:
        1px solid rgba(255,255,255,0.075);

    border-radius: 22px;

    background:
        rgba(255,255,255,0.045);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 16px 45px
        rgba(0,0,0,0.23);

    flex-shrink: 0;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-area {

    width: 100%;

    padding: 7px 0 3px;

    cursor: pointer;

    touch-action: none;
}


.progress-bar {

    position: relative;

    width: 100%;

    height: 5px;

    border-radius: 999px;

    background:
        rgba(255,255,255,0.13);
}


.progress-fill {

    position: absolute;

    left: 0;
    top: 0;

    width: 0%;

    height: 100%;

    border-radius: 999px;

    background:
        linear-gradient(
            90deg,
            #ff9abd,
            #df628d
        );
}


.progress-dot {

    position: absolute;

    width: 13px;
    height: 13px;

    left: 0;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #ffffff;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.35);
}


.time-row {

    display: flex;

    justify-content: space-between;

    margin-top: 7px;

    color:
        rgba(255,255,255,0.38);

    font-size: 11px;

    font-variant-numeric:
        tabular-nums;
}


/* =====================================================
   MAIN CONTROL
===================================================== */

.controls {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 25px;

    margin-top: 10px;
}


.control-button {

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 50%;

    background: transparent;

    color:
        rgba(255,255,255,0.58);

    font-size: 23px;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    touch-action: manipulation;
}


.control-button:active {

    transform: scale(0.88);
}


.main-play {

    width: 64px;
    height: 64px;

    border: none;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #ff9cbd,
            #d95c87
        );

    color: #ffffff;

    font-size: 24px;

    cursor: pointer;

    box-shadow:
        0 12px 30px
        rgba(217,92,135,0.36);

    touch-action: manipulation;

    transition:
        transform 0.15s ease;
}


.main-play:active {

    transform: scale(0.91);
}


.play-icon {

    margin-left: 3px;
}


/* =====================================================
   ACTION BUTTONS
===================================================== */

.actions {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    margin-top: 15px;

    flex-shrink: 0;
}


.action-button {

    min-width: 105px;

    min-height: 40px;

    padding:
        9px 15px;

    border:
        1px solid rgba(255,255,255,0.09);

    border-radius: 999px;

    background:
        rgba(255,255,255,0.04);

    color:
        rgba(255,255,255,0.65);

    font-size: 12px;

    text-decoration: none;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    cursor: pointer;

    touch-action: manipulation;
}


.action-button:active {

    transform: scale(0.96);
}


/* =====================================================
   HINT
===================================================== */

.hint {

    margin-top: 13px;

    color:
        rgba(255,255,255,0.31);

    font-size: 11px;

    line-height: 1.6;

    flex-shrink: 0;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    margin-top: auto;

    padding-top: 13px;

    color:
        rgba(255,255,255,0.16);

    font-size: 9px;

    letter-spacing: 2px;

    flex-shrink: 0;
}


/* =====================================================
   TOAST
===================================================== */

.toast {

    position: fixed;

    left: 50%;

    bottom:
        max(28px, env(safe-area-inset-bottom));

    transform:
        translate(-50%, 15px);

    padding:
        10px 17px;

    border-radius: 999px;

    background:
        rgba(25,25,32,0.94);

    border:
        1px solid rgba(255,255,255,0.10);

    color:
        rgba(255,255,255,0.82);

    font-size: 12px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;

    z-index: 999;
}


.toast.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes recordRotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


@keyframes nfcPulse {

    0%, 100% {

        opacity: 0.45;

        transform: scale(0.9);
    }

    50% {

        opacity: 1;

        transform: scale(1.15);
    }
}


@keyframes pageIn {

    from {

        opacity: 0;

        transform:
            translateY(12px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =====================================================
   iPhone SE / 小屏手机
===================================================== */

@media (max-height: 700px) {

    .nfc-badge {

        margin-bottom: 12px;
    }

    .record-wrapper {

        width: 205px;
        height: 205px;

        margin-bottom: 15px;
    }

    .song-subtitle {

        margin-bottom: 12px;
    }

    .player {

        padding-top: 12px;
        padding-bottom: 11px;
    }

    .actions {

        margin-top: 10px;
    }

    .hint {

        margin-top: 8px;
    }
}


/* =====================================================
   iPhone 横屏
===================================================== */

@media (orientation: landscape) {

    .container {

        max-width: 700px;
    }

    .record-wrapper {

        width: 180px;
        height: 180px;
    }
}

</style>

</head>


<body>


<div class="page">


<main class="container">


    <!-- NFC -->

    <div class="nfc-badge">

        <span class="nfc-dot"></span>

        NFC · TAP TO LISTEN

    </div>


    <!-- BLACK VINYL -->

    <div class="record-wrapper">

        <div
            class="record-glow"
            id="recordGlow">
        </div>


        <div
            class="record"
            id="record">


            <div class="record-center">

                <img
                    src="cover.jpg"
                    alt="音乐封面"
                    onerror="this.style.display='none';">

            </div>


            <div class="record-hole"></div>


        </div>

    </div>


    <!-- SONG -->

    <h1 class="song-title">
        说爱你
    </h1>


    <div class="song-subtitle">
        交响乐版
    </div>


    <!-- PLAYER -->

    <section class="player">


        <audio
            id="audio"
            src="music.mp3"
            preload="metadata">
        </audio>


        <!-- PROGRESS -->

        <div
            class="progress-area"
            id="progressArea">


            <div class="progress-bar">


                <div
                    class="progress-fill"
                    id="progressFill">
                </div>


                <div
                    class="progress-dot"
                    id="progressDot">
                </div>


            </div>


            <div class="time-row">


                <span id="currentTime">
                    0:00
                </span>


                <span id="duration">
                    0:00
                </span>


            </div>


        </div>


        <!-- CONTROLS -->

        <div class="controls">


            <button
                class="control-button"
                id="backButton"
                aria-label="后退10秒">

                ↶

            </button>


            <button
                class="main-play"
                id="playButton"
                aria-label="播放音乐">

                <span
                    class="play-icon"
                    id="playIcon">

                    ▶

                </span>

            </button>


            <button
                class="control-button"
                id="forwardButton"
                aria-label="前进10秒">

                ↷

            </button>


        </div>


    </section>


    <!-- ACTIONS -->

    <div class="actions">


        <a
            class="action-button"
            href="music.mp3"
            download>

            ↓ 下载音乐

        </a>


        <button
            class="action-button"
            id="shareButton">

            ↗ 分享

        </button>


    </div>


    <!-- HINT -->

    <div class="hint">

        轻触 NFC 标签即可打开音乐<br>

        点击 ▶ 开始播放

    </div>


    <div class="footer">

        NFC MUSIC CARD

    </div>


</main>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("playButton");

const playIcon =
    document.getElementById("playIcon");

const record =
    document.getElementById("record");

const recordGlow =
    document.getElementById("recordGlow");

const progressArea =
    document.getElementById("progressArea");

const progressFill =
    document.getElementById("progressFill");

const progressDot =
    document.getElementById("progressDot");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const backButton =
    document.getElementById("backButton");

const forwardButton =
    document.getElementById("forwardButton");

const shareButton =
    document.getElementById("shareButton");

const toast =
    document.getElementById("toast");


/* =====================================================
   TIME
===================================================== */

function formatTime(seconds) {

    if (!isFinite(seconds)) {

        return "0:00";

    }

    const minutes =
        Math.floor(seconds / 60);

    const secondsPart =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

    return minutes + ":" + secondsPart;

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(
        function () {

            toast.classList.remove("show");

        },
        2200
    );

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

playButton.addEventListener(
    "click",
    async function () {

        try {

            if (audio.paused) {

                await audio.play();

            } else {

                audio.pause();

            }

        } catch (error) {

            showToast(
                "音乐暂时无法播放，请再次点击"
            );

        }

    }
);


/* =====================================================
   PLAY STATE
===================================================== */

audio.addEventListener(
    "play",
    function () {

        playIcon.textContent = "Ⅱ";

        record.classList.add("playing");

        recordGlow.style.opacity = "1";

    }
);


audio.addEventListener(
    "pause",
    function () {

        playIcon.textContent = "▶";

        record.classList.remove("playing");

        recordGlow.style.opacity = "0.6";

    }
);


audio.addEventListener(
    "ended",
    function () {

        playIcon.textContent = "▶";

        record.classList.remove("playing");

        recordGlow.style.opacity = "0.6";

        progressFill.style.width = "0%";

        progressDot.style.left = "0%";

        currentTime.textContent = "0:00";

    }
);


/* =====================================================
   METADATA
===================================================== */

audio.addEventListener(
    "loadedmetadata",
    function () {

        duration.textContent =
            formatTime(audio.duration);

    }
);


/* =====================================================
   PROGRESS
===================================================== */

audio.addEventListener(
    "timeupdate",
    function () {

        if (!audio.duration) {

            return;

        }

        const percent =
            (audio.currentTime /
             audio.duration) * 100;

        progressFill.style.width =
            percent + "%";

        progressDot.style.left =
            percent + "%";

        currentTime.textContent =
            formatTime(audio.currentTime);

    }
);


/* =====================================================
   SEEK
===================================================== */

function seekFromPosition(clientX) {

    if (!audio.duration) {

        return;

    }

    const rect =
        progressArea.getBoundingClientRect();

    let percent =
        (clientX - rect.left) /
        rect.width;

    percent =
        Math.max(
            0,
            Math.min(1, percent)
        );

    audio.currentTime =
        percent * audio.duration;

}


progressArea.addEventListener(
    "click",
    function (event) {

        seekFromPosition(
            event.clientX
        );

    }
);


/* =====================================================
   BACK 10 SEC
===================================================== */

backButton.addEventListener(
    "click",
    function () {

        audio.currentTime =
            Math.max(
                0,
                audio.currentTime - 10
            );

    }
);


/* =====================================================
   FORWARD 10 SEC
===================================================== */

forwardButton.addEventListener(
    "click",
    function () {

        if (!audio.duration) {

            return;

        }

        audio.currentTime =
            Math.min(
                audio.duration,
                audio.currentTime + 10
            );

    }
);


/* =====================================================
   SHARE
===================================================== */

shareButton.addEventListener(
    "click",
    async function () {

        const shareData = {

            title:
                "说爱你 · 交响乐版",

            text:
                "NFC Music Card",

            url:
                window.location.href

        };


        if (
            navigator.share &&
            typeof navigator.share === "function"
        ) {

            try {

                await navigator.share(
                    shareData
                );

            } catch (error) {

                /* 用户主动取消分享 */
            }

        } else {

            try {

                await navigator.clipboard.writeText(
                    window.location.href
                );

                showToast(
                    "音乐链接已复制"
                );

            } catch (error) {

                showToast(
                    "请复制浏览器地址分享"
                );

            }

        }

    }
);


/* =====================================================
   PREVENT ACCIDENTAL LONG-PRESS MENU
===================================================== */

document.addEventListener(
    "contextmenu",
    function (event) {

        if (
            event.target.closest(
                ".record"
            )
        ) {

            event.preventDefault();

        }

    }
);


/* =====================================================
   INITIAL STATE
===================================================== */

window.addEventListener(
    "load",
    function () {

        recordGlow.style.opacity = "0.6";

    }
);

</script>


</body>

</html>
